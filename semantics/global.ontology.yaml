  iri: "http://www.entropy-data.com/ns/main/Shipment"
  group: "fulfillment"
  custom_properties:
    name@de: "Sendung"
    name@fr: "Expédition"
    description@de: "Ein Paket, das zur Erfüllung einer oder mehrerer Bestellpositionen versendet wird."
