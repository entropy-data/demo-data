  custom_properties:
    name@de: "Einzelpreis"
    name@fr: "Prix unitaire"
    description@de: "Preis pro Einheit zum Zeitpunkt des Kaufs, in der Bestellwährung."
    description@fr: "Prix par unité au moment de l'achat, dans la devise de la commande."
- concept: "vat_id"
  id: "billing_address.vat-id"
