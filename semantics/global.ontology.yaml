- concept: "Average Order Value"
  id: "average_order_value"
  type: "MetricType"
  description: |-
    The typical amount a customer spends per order. A core commerce KPI used to
    gauge pricing, bundling, and cross-sell effectiveness.
  iri: "http://www.entropy-data.com/ns/main/AverageOrderValue"
  group: "sales"
  unit: "EUR"
  better_when: "higher"
  formula: "SUM(order.total_amount) / COUNT(DISTINCT order.id)"
  custom_properties:
    name@de: "Durchschnittlicher Bestellwert"
    name@fr: "Valeur moyenne de commande"
    description@de: "Der typische Betrag, den ein Kunde pro Bestellung ausgibt. Eine zentrale Kennzahl für Preisgestaltung, Bundling und Cross-Selling."
    description@fr: "Le montant typique qu'un client dépense par commande. Un indicateur clé pour la tarification, le bundling et la vente croisée."
  relationships:
  - id: "aov_derived_from_gmv"
    name: "derived_from"
    description: "Average Order Value is derived from Gross Merchandise Value (divided by order count)."
    roles:
    - concept: "Gross Merchandise Value"
    verbalizes:
    - "{Average Order Value} derived from {Gross Merchandise Value}"
    type: "derived_from"
  - id: "aov_measures_order"
    name: "measures"
    description: "Average Order Value is measured on the Order entity."
    roles:
    - concept: "Order"
    verbalizes:
    - "{Average Order Value} measures {Order}"
    type: "measures"
- concept: "Contribution Margin 1"
  id: "contribution_margin_1"
  type: "MetricType"
  description: |-
    GMV minus Cost of Goods Sold (COGS). The first step in the contribution-margin
    ladder. Shows what is left after paying for the products themselves.
  iri: "http://www.entropy-data.com/ns/main/ContributionMargin1"
  group: "controlling"
  unit: "EUR"
  better_when: "higher"
  formula: "GMV - COGS"
  custom_properties:
    abbreviation: "CM1"
    name@de: "Deckungsbeitrag 1"
    name@fr: "Marge de contribution 1"
    description@de: "Bruttowarenwert abzüglich Wareneinsatz (COGS). Die erste Stufe der Deckungsbeitragsrechnung. Zeigt, was nach den Warenkosten übrig bleibt."
    description@fr: "Valeur brute des marchandises moins le coût des marchandises vendues (COGS). Première étape de la marge de contribution. Ce qui reste après les coûts produits."
  relationships:
  - id: "cm1_derived_from_gmv"
    name: "derived_from"
    description: "Contribution Margin 1 is GMV minus Cost of Goods Sold."
    roles:
    - concept: "Gross Merchandise Value"
    verbalizes:
    - "{Contribution Margin 1} derived from {Gross Merchandise Value}"
    type: "derived_from"
  - id: "cm1_measures_order"
    name: "measures"
    description: "Contribution Margin 1 is measured per order."
    roles:
    - concept: "Order"
    verbalizes:
    - "{Contribution Margin 1} measures {Order}"
    type: "measures"
- concept: "Contribution Margin 2"
  id: "contribution_margin_2"
  type: "MetricType"
  description: |-
    CM1 minus variable fulfillment, payment, and marketing costs. Shows the margin
    left after all directly attributable variable costs of the sale.
  iri: "http://www.entropy-data.com/ns/main/ContributionMargin2"
  group: "controlling"
  unit: "EUR"
  better_when: "higher"
  formula: "CM1 - variable_fulfillment_costs - payment_costs - marketing_costs"
  custom_properties:
    abbreviation: "CM2"
    name@de: "Deckungsbeitrag 2"
    name@fr: "Marge de contribution 2"
    description@de: "DB1 abzüglich variabler Fulfillment-, Zahlungs- und Marketingkosten. Zeigt die Marge nach allen direkt zurechenbaren variablen Kosten des Verkaufs."
    description@fr: "MC1 moins les coûts variables de logistique, de paiement et de marketing. Indique la marge après l'ensemble des coûts variables directement imputables à la vente."
  relationships:
  - id: "cm2_derived_from_cm1"
    name: "derived_from"
    description: "Contribution Margin 2 is CM1 minus variable fulfillment, payment, and marketing costs."
    roles:
    - concept: "Contribution Margin 1"
    verbalizes:
    - "{Contribution Margin 2} derived from {Contribution Margin 1}"
    type: "derived_from"
  - id: "cm2_measures_order"
    name: "measures"
    description: "Contribution Margin 2 is measured per order."
    roles:
    - concept: "Order"
    verbalizes:
    - "{Contribution Margin 2} measures {Order}"
    type: "measures"
- concept: "Conversion Rate"
  id: "conversion_rate"
  type: "MetricType"
  description: |-
    Share of website sessions that result in a completed order. The headline
    funnel KPI for ecommerce. Higher is better.
  iri: "http://www.entropy-data.com/ns/main/ConversionRate"
  group: "sales"
  unit: "%"
  better_when: "higher"
  formula: "COUNT(order) / COUNT(session) * 100"
  custom_properties:
    name@de: "Konversionsrate"
    name@fr: "Taux de conversion"
    description@de: "Anteil der Website-Sitzungen, die zu einer abgeschlossenen Bestellung führen. Die zentrale Funnel-Kennzahl im E-Commerce. Je höher, desto besser."
    description@fr: "Part des sessions du site qui aboutissent à une commande finalisée. L'indicateur clé du tunnel de conversion e-commerce. Plus c'est haut, mieux c'est."
  relationships:
  - id: "conversion_rate_measures_order"
    name: "measures"
    description: "Conversion Rate is measured against placed orders as the desired outcome."
    roles:
    - concept: "Order"
    verbalizes:
    - "{Conversion Rate} measures {Order}"
    type: "measures"
- concept: "Gross Merchandise Value"
  id: "gmv"
  type: "MetricType"
  description: |-
    Total value of all placed orders before refunds, returns, and discounts.
    The headline ecommerce KPI, commonly abbreviated as GMV.
  iri: "http://www.entropy-data.com/ns/main/GrossMerchandiseValue"
  group: "controlling"
  unit: "EUR"
  better_when: "higher"
  formula: "SUM(order.total_amount)"
  custom_properties:
    abbreviation: "GMV"
    name@de: "Bruttowarenwert"
    name@fr: "Valeur brute des marchandises"
    description@de: "Gesamtwert aller aufgegebenen Bestellungen vor Rückerstattungen, Retouren und Rabatten. Die zentrale E-Commerce-Kennzahl, oft als GMV abgekürzt."
    description@fr: "Valeur totale de toutes les commandes passées avant remboursements, retours et remises. L'indicateur clé de l'e-commerce, souvent abrégé GMV."
  relationships:
  - id: "gmv_measures_order_total"
    name: "measures"
    description: "Gross Merchandise Value is the aggregation of the order's total amount."
    roles:
    - concept: "total_amount"
    verbalizes:
    - "{Gross Merchandise Value} measures {total_amount}"
    type: "measures"
- concept: "No-Find Rate"
  id: "no_find_rate"
  type: "MetricType"
  description: |-
    Share of warehouse pick tasks where the picker could not locate the item at
    its expected storage location (out of stock, misplaced, damaged). A core
    warehouse-quality KPI. Lower is better.
  iri: "http://www.entropy-data.com/ns/main/NoFindRate"
  group: "fulfillment"
  unit: "%"
  better_when: "lower"
  formula: "COUNT(pick_task WHERE status = 'not_found') / COUNT(pick_task) * 100"
  custom_properties:
    name@de: "Nichtauffindungsquote"
    name@fr: "Taux d'introuvables"
    description@de: "Anteil der Kommissionier-Vorgänge im Lager, bei denen der Artikel am erwarteten Lagerplatz nicht gefunden werden konnte (vergriffen, falsch eingelagert, beschädigt). Eine zentrale Kennzahl für die Lagerqualität. Je niedriger, desto besser."
    description@fr: "Part des opérations de picking en entrepôt où l'article n'a pas pu être trouvé à son emplacement prévu (rupture, mal rangé, endommagé). Un indicateur clé de la qualité d'entrepôt. Plus c'est bas, mieux c'est."
  relationships:
  - id: "no_find_rate_measures_line_item"
    name: "measures"
    description: "No-Find Rate is measured per warehouse pick task (one per line item)."
    roles:
    - concept: "Line Item"
    verbalizes:
    - "{No-Find Rate} measures {Line Item}"
    type: "measures"
- concept: "Order Fulfillment Time"
  id: "order_fulfillment_time"
  type: "MetricType"
  description: |-
    Average time between an order being placed and the first shipment leaving the
    warehouse. A core fulfillment KPI. Lower is better.
  iri: "http://www.entropy-data.com/ns/main/OrderFulfillmentTime"
  group: "fulfillment"
  unit: "hours"
  better_when: "lower"
  formula: "AVG(shipment.dispatched_at - order.placed_at)"
  custom_properties:
    name@de: "Auftragsabwicklungszeit"
    name@fr: "Délai d'exécution des commandes"
    description@de: "Durchschnittliche Zeit zwischen Bestelleingang und Versand aus dem Lager. Eine zentrale Kennzahl für die Auftragsabwicklung. Je niedriger, desto besser."
    description@fr: "Temps moyen entre la passation d'une commande et l'expédition depuis l'entrepôt. Un indicateur clé de l'exécution. Plus c'est bas, mieux c'est."
  relationships:
  - id: "fulfillment_time_measures_shipment"
    name: "measures"
    description: "Order Fulfillment Time is measured on the Shipment entity."
    roles:
    - concept: "Shipment"
    verbalizes:
    - "{Order Fulfillment Time} measures {Shipment}"
    type: "measures"
