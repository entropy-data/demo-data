    ed:examples:
    - "2024-09-12T18:42:07Z"
    ed:description@de: "Zeitstempel der letzten authentifizierten Sitzung des Kunden."
    ed:description@fr: "Horodatage de la dernière session authentifiée du client."
- concept: "B2C/Customer.LastName"
  type: "ValueType"
  description: "Family name as provided at registration."
