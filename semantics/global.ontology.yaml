    description@de: "Nachname, wie bei der Registrierung angegeben."
    description@fr: "Nom de famille fourni lors de l'enregistrement."
- concept: "line_number"
  id: "line_item.line-number"
  type: "ValueType"
  description: "Position of the line item within the order, starting at 1."
  extends:
  - "Integer"
  examples:
  - "1"
  - "2"
  custom_properties:
    name@de: "Positionsnummer"
    name@fr: "Numéro de ligne"
    description@de: "Position der Bestellposition innerhalb der Bestellung, beginnend bei 1."
    description@fr: "Position de la ligne de commande dans la commande, à partir de 1."
- concept: "line_total"
  id: "line_item.line-total"
  type: "ValueType"
  description: "Net total for this line after discount, excluding shipping (quantity * unit_price - discount_amount)."
  extends:
  - "Decimal"
  examples:
  - "54.98"
  custom_properties:
    name@de: "Positionssumme"
    name@fr: "Total de la ligne"
    description@de: "Nettosumme dieser Position nach Rabatt, ohne Versand (Menge × Einzelpreis − Rabatt)."
    description@fr: "Total net de cette ligne après remise, hors frais de port (quantité × prix unitaire − remise)."
- concept: "list_price"
  id: "article.list-price"
  type: "ValueType"
  description: "Variant-specific list price before discounts."
  extends:
  - "Decimal"
  examples:
  - "26.99"
  custom_properties:
    name@de: "Listenpreis"
    name@fr: "Prix catalogue"
    description@de: "Variantenspezifischer Listenpreis vor Rabatten."
    description@fr: "Prix catalogue spécifique à la variante avant remises."
- concept: "loyalty_points_balance"
  id: "customer.loyalty-points-balance"
  type: "ValueType"
  description: "Current redeemable loyalty points balance."
  extends:
  - "Integer"
  classification: "Internal"
  examples:
  - "1250"
  custom_properties:
    name@de: "Treuepunkte-Saldo"
    name@fr: "Solde de points de fidélité"
    description@de: "Aktuelles einlösbares Treuepunkte-Guthaben."
    description@fr: "Solde actuel de points de fidélité échangeables."
- concept: "loyalty_tier"
  id: "customer.loyalty-tier"
  type: "ValueType"
  description: "Loyalty program segment assigned based on rolling 12-month spend."
  extends:
  - "String"
  classification: "Internal"
  examples:
  - "gold"
  enum:
  - "none"
  - "bronze"
  - "silver"
  - "gold"
  - "platinum"
  custom_properties:
    name@de: "Treuestufe"
    name@fr: "Niveau de fidélité"
    description@de: "Segment des Treueprogramms, basierend auf den Ausgaben der rollierenden letzten 12 Monate."
    description@fr: "Segment du programme de fidélité attribué en fonction des dépenses sur 12 mois glissants."
- concept: "marketing_consent"
  id: "customer.marketing-consent"
  type: "ValueType"
  description: "Whether the customer has opted in to marketing communications (GDPR Art. 6(1)(a))."
  extends:
  - "Boolean"
  classification: "Restricted"
  examples:
  - "true"
  custom_properties:
    name@de: "Marketing-Einwilligung"
    name@fr: "Consentement marketing"
    description@de: "Ob der Kunde Marketingkommunikation zugestimmt hat (DSGVO Art. 6 Abs. 1 lit. a)."
    description@fr: "Indique si le client a consenti aux communications marketing (RGPD Art. 6(1)(a))."
- concept: "order_status"
  id: "order.order-status"
  type: "ValueType"
  description: "Lifecycle state of the order. An order that never shipped is cancelled; one that shipped and came back is returned, whole or in part."
  extends:
  - "String"
  examples:
  - "delivered"
  enum:
  - "pending"
  - "confirmed"
  - "shipped"
  - "delivered"
  - "cancelled"
  - "returned"
  - "partially_returned"
  custom_properties:
    name@de: "Bestellstatus"
    name@fr: "Statut de la commande"
    description@de: "Lebenszyklusstatus der Bestellung. Eine Bestellung, die nie versandt wurde, ist storniert; eine versandte und zurückgesandte ist retourniert, ganz oder teilweise."
    description@fr: "État du cycle de vie de la commande."
- concept: "placed_at"
  id: "order.placed-at"
  type: "ValueType"
  description: "The timestamp when the order was placed."
  extends:
  - "DateTime"
  examples:
  - "2023-11-23T11:00:33Z"
  custom_properties:
    name@de: "Bestellzeitpunkt"
    name@fr: "Date de commande"
    description@de: "Der Zeitstempel, zu dem die Bestellung aufgegeben wurde."
    description@fr: "L'horodatage auquel la commande a été passée."
- concept: "postal_code"
  id: "postal_address.postal_code"
  type: "ValueType"
  extends:
  - "String"
  classification: "Restricted"
  examples:
  - "80331"
  custom_properties:
    name@de: "Postleitzahl"
    name@fr: "Code postal"
- concept: "preferred_language"
  id: "customer.preferred-language"
  type: "ValueType"
  description: "IETF BCP 47 language tag used for communications and storefront localization."
  extends:
  - "String"
  examples:
  - "en-US"
  - "de-DE"
  pattern: "^[a-z]{2}(-[A-Z]{2})?$"
  custom_properties:
    name@de: "Bevorzugte Sprache"
    name@fr: "Langue préférée"
    description@de: "IETF BCP 47 Sprachkennzeichen für Kommunikation und Storefront-Lokalisierung."
    description@fr: "Étiquette de langue IETF BCP 47 utilisée pour les communications et la localisation de la boutique."
- concept: "product_id"
  id: "product.product-id"
  type: "ValueType"
  description: "Internal unique identifier for the catalog product."
  extends:
  - "String"
  classification: "Internal"
  examples:
  - "P-10042"
  custom_properties:
    name@de: "Produkt-ID"
    name@fr: "ID du produit"
    description@de: "Interne eindeutige Kennung für das Katalogprodukt."
    description@fr: "Identifiant interne unique du produit catalogue."
- concept: "quantity"
  id: "line_item.quantity"
  type: "ValueType"
  description: "Number of units of the article purchased in this line."
  extends:
  - "Integer"
  examples:
  - "2"
  custom_properties:
    name@de: "Menge"
    name@fr: "Quantité"
    description@de: "Anzahl der in dieser Position gekauften Einheiten des Artikels."
    description@fr: "Nombre d'unités de l'article achetées sur cette ligne."
- concept: "registered_at"
  id: "customer.registered-at"
  type: "ValueType"
  description: "Timestamp when the customer account was created."
  extends:
  - "DateTime"
  examples:
  - "2022-03-17T09:21:44Z"
  custom_properties:
    name@de: "Registrierungsdatum"
    name@fr: "Date d'enregistrement"
    description@de: "Zeitstempel, zu dem das Kundenkonto erstellt wurde."
    description@fr: "Horodatage de création du compte client."
- concept: "size"
  id: "article.size"
  type: "ValueType"
  description: "Size variant, using the sizing system appropriate to the product category."
  extends:
  - "String"
  examples:
  - "S"
  - "M"
  - "L"
  - "42"
  custom_properties:
    name@de: "Größe"
    name@fr: "Taille"
    description@de: "Größenvariante unter Verwendung des für die Produktkategorie passenden Größensystems."
    description@fr: "Variante de taille, utilisant le système de tailles adapté à la catégorie de produit."
- concept: "street"
  id: "postal_address.street"
  type: "ValueType"
  extends:
  - "String"
  classification: "Restricted"
  examples:
  - "Marienplatz 8"
  custom_properties:
    name@de: "Straße"
    name@fr: "Rue"
- concept: "tax_rate"
  id: "line_item.tax-rate"
  type: "ValueType"
  description: "Applicable VAT/sales tax rate as a decimal fraction (e.g. 0.19 for 19%)."
  extends:
  - "Decimal"
  examples:
  - "0.19"
  custom_properties:
    name@de: "Steuersatz"
    name@fr: "Taux de TVA"
    description@de: "Geltender Umsatzsteuersatz als Dezimalbruch (z. B. 0,19 für 19 %)."
    description@fr: "Taux de TVA applicable sous forme de fraction décimale (p. ex. 0,19 pour 19 %)."
- concept: "title"
  id: "product.title"
  type: "ValueType"
  description: "Display name of the product."
  extends:
  - "String"
  examples:
  - "Organic Cotton T-Shirt"
  custom_properties:
    name@de: "Titel"
    name@fr: "Titre"
    description@de: "Anzeigename des Produkts."
    description@fr: "Nom d'affichage du produit."
- concept: "total_amount"
  id: "order.total-amount"
  type: "ValueType"
  description: "Order total in the customer's transaction currency, net of VAT."
  extends:
  - "Decimal"
  examples:
  - "149.90"
  custom_properties:
    name@de: "Gesamtbetrag"
    name@fr: "Montant total"
    description@de: "Bestellsumme in der Transaktionswährung des Kunden."
    description@fr: "Total de la commande dans la devise de transaction du client."
- concept: "tracking_url"
  id: "shipment.tracking-url"
  type: "ValueType"
  description: "Public tracking link provided by the carrier."
  extends:
  - "String"
  examples:
  - "https://track.dhl.com/?tracking-id=00340434292135100186"
  custom_properties:
    name@de: "Tracking-URL"
    name@fr: "URL de suivi"
    description@de: "Öffentlicher Tracking-Link, der vom Versanddienstleister bereitgestellt wird."
    description@fr: "Lien de suivi public fourni par le transporteur."
- concept: "unit_price"
  id: "line_item.unit-price"
  type: "ValueType"
  description: "Price per unit at the time of purchase, in the order currency."
  extends:
  - "Decimal"
  examples:
