- concept: "B2C/Customer.Gender"
  type: "ValueType"
  description: "Self-declared gender. Optional at registration."
  iri: "http://entropy-data.com/ontologies/global/B2C/Customer.Gender"
  extends:
  - "String"
  annotations:
    ed:label: "Gender"
    ed:label@de: "Geschlecht"
    ed:label@fr: "Genre"
    ed:classification: "Restricted"
    ed:examples:
    - "female"
    ed:enum:
    - "female"
    - "male"
    - "diverse"
    - "undisclosed"
    ed:description@de: "Selbstangegebenes Geschlecht. Optional bei der Registrierung."
    ed:description@fr: "Genre auto-déclaré. Facultatif lors de l'enregistrement."
- concept: "Catalog/Article.Gtin"
  type: "ValueType"
  description: "Global Trade Item Number (EAN/UPC) encoded on the article's barcode."
  iri: "http://entropy-data.com/ontologies/global/Catalog/Article.Gtin"
  extends:
  - "String"
  annotations:
    ed:label: "GTIN"
    ed:label@de: "GTIN"
    ed:label@fr: "GTIN"
    ed:examples:
    - "4006381333931"
    ed:pattern: "^[0-9]{8,14}$"
    ed:description@de: "Global Trade Item Number (EAN/UPC), die auf dem Barcode des Artikels codiert ist."
    ed:description@fr: "Global Trade Item Number (EAN/UPC) encodée sur le code-barres de l'article."
- concept: "B2B/Customer.IndustryCode"
  type: "ValueType"
  description: "NACE Rev. 2 code of the company's main economic activity."
  iri: "http://entropy-data.com/ontologies/global/B2B/Customer.IndustryCode"
  extends:
  - "String"
  annotations:
    ed:label: "Industry Code"
    ed:label@de: "Branchencode"
    ed:label@fr: "Code d'activité"
    ed:examples:
    - "47.91"
    - "62.01"
    ed:pattern: "^[0-9]{2}(\\.[0-9]{1,2})?$"
    ed:description@de: "NACE-Rev.-2-Code der wirtschaftlichen Haupttätigkeit des Unternehmens."
    ed:description@fr: "Code NACE Rév. 2 de l'activité économique principale de l'entreprise."
- concept: "B2B/Customer.InvoiceEmail"
  type: "ValueType"
  description: "Email address of the customer's accounts payable department, where invoices and payment reminders are sent."
  iri: "http://entropy-data.com/ontologies/global/B2B/Customer.InvoiceEmail"
  extends:
  - "String"
  annotations:
    ed:label: "Invoice Email"
    ed:label@de: "Rechnungs-E-Mail"
    ed:label@fr: "E-mail de facturation"
    ed:classification: "Internal"
    ed:examples:
    - "invoices@acme.example"
    ed:pattern: "^.*@.*$"
    ed:description@de: "E-Mail-Adresse der Kreditorenbuchhaltung des Kunden, an die Rechnungen und Zahlungserinnerungen gehen."
    ed:description@fr: "Adresse e-mail du service comptabilité fournisseurs du client, à laquelle sont envoyées les factures et les relances."
- concept: "B2C/Customer.LastLoginAt"
  type: "ValueType"
