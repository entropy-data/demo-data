version: "0.3.0.dev0"
name: "global"
description: "Core business semantics for the demo retail organization."
annotations:
  ed:display_name: "Global"
  ed:owner: "governance-group"
prefixes:
  ed: "http://entropy-data.com/ns/ed#"
ontology:
- concept: "B2B"
  type: "EntityType"
  description: "Companies and public institutions that buy for their business, on invoice and under negotiated payment terms."
  iri: "http://entropy-data.com/ontologies/global/B2B"
  annotations:
    ed:label: "B2B"
    ed:label@de: "B2B"
    ed:label@fr: "B2B"
    ed:entity_type: "GroupType"
    ed:description@de: "Unternehmen und öffentliche Einrichtungen, die für den geschäftlichen Bedarf einkaufen, auf Rechnung und zu vereinbarten Zahlungsbedingungen."
    ed:description@fr: "Entreprises et organismes publics qui achètent pour leurs besoins professionnels, sur facture et selon des conditions de paiement négociées."
- concept: "B2C"
  type: "EntityType"
  description: "Private consumers who buy for personal use, with a registered account or as guests."
  iri: "http://entropy-data.com/ontologies/global/B2C"
  annotations:
    ed:label: "B2C"
    ed:label@de: "B2C"
    ed:label@fr: "B2C"
    ed:entity_type: "GroupType"
    ed:description@de: "Privatkunden, die für den persönlichen Bedarf einkaufen, mit registriertem Konto oder als Gast."
    ed:description@fr: "Particuliers qui achètent pour un usage personnel, avec un compte enregistré ou en tant qu'invités."
- concept: "Catalog"
  type: "EntityType"
  description: "Products, orderable article variants, and brands offered for sale."
  iri: "http://entropy-data.com/ontologies/global/Catalog"
  annotations:
    ed:label: "Catalog"
    ed:label@de: "Katalog"
    ed:label@fr: "Catalogue"
    ed:entity_type: "GroupType"
    ed:description@de: "Produkte, bestellbare Artikelvarianten und Marken, die zum Verkauf angeboten werden."
    ed:description@fr: "Produits, variantes d'articles commandables et marques proposés à la vente."
- concept: "Controlling"
  type: "EntityType"
  description: "Financial KPIs and commercial performance metrics."
  iri: "http://entropy-data.com/ontologies/global/Controlling"
  annotations:
    ed:label: "Controlling"
    ed:label@de: "Controlling"
    ed:label@fr: "Contrôle de gestion"
    ed:entity_type: "GroupType"
    ed:description@de: "Finanzkennzahlen und kommerzielle Leistungsindikatoren."
    ed:description@fr: "Indicateurs financiers et mesures de performance commerciale."
- concept: "Fulfillment"
  type: "EntityType"
  description: "Inventory, picking, packing, and shipment of orders."
  iri: "http://entropy-data.com/ontologies/global/Fulfillment"
  annotations:
    ed:label: "Fulfillment"
    ed:label@de: "Auftragsabwicklung"
    ed:label@fr: "Exécution"
    ed:entity_type: "GroupType"
    ed:description@de: "Bestandsverwaltung, Kommissionierung, Verpackung und Versand der Bestellungen."
    ed:description@fr: "Gestion des stocks, préparation, emballage et expédition des commandes."
- concept: "Sales"
  type: "EntityType"
  description: "Order taking, checkout, and post-sale customer service."
  iri: "http://entropy-data.com/ontologies/global/Sales"
  annotations:
    ed:label: "Sales"
    ed:label@de: "Vertrieb"
    ed:label@fr: "Ventes"
    ed:entity_type: "GroupType"
    ed:description@de: "Bestellannahme, Checkout und Kundenservice nach dem Verkauf."
    ed:description@fr: "Prise de commande, paiement et service après-vente."
- concept: "TechnicalFields"
  type: "EntityType"
  description: "Data pipeline metadata fields common to many tables, such as ingestion and processing timestamps."
  iri: "http://entropy-data.com/ontologies/global/TechnicalFields"
  annotations:
    ed:label: "Technical Fields"
    ed:label@de: "Technische Felder"
    ed:label@fr: "Champs techniques"
    ed:entity_type: "GroupType"
    ed:description@de: "Metadatenfelder der Datenpipeline, die in vielen Tabellen vorkommen, wie z. B. Zeitstempel für Ingestion und Verarbeitung."
    ed:description@fr: "Champs de métadonnées du pipeline de données communs à de nombreuses tables, tels que les horodatages d'ingestion et de traitement."
- concept: "B2C/CustomerEmail"
  type: "ValueType"
  description: "The email address of a B2C customer."
  iri: "http://entropy-data.com/ontologies/global/B2C/CustomerEmail"
  extends:
  - "String"
  annotations:
    ed:label: "Customer Email"
    ed:label@de: "Kunden-E-Mail"
    ed:label@fr: "E-mail du client"
    ed:shared: true
    ed:classification: "Restricted"
    ed:examples:
    - "mail@example.com"
    ed:pattern: "^.*@.*$"
    ed:description@de: "Die E-Mail-Adresse eines B2C-Kunden."
    ed:description@fr: "L'adresse e-mail d'un client B2C."
  relationships:
  - name: "member_of"
    roles:
    - concept: "B2C"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{B2C/CustomerEmail} is a member of {B2C}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "B2C/CustomerId"
  type: "ValueType"
  description: "The internal ID of a B2C customer in the online shop. Guest customers have a customer ID as well."
  iri: "http://entropy-data.com/ontologies/global/B2C/CustomerId"
  extends:
  - "String"
  annotations:
    ed:label: "Customer ID"
    ed:label@de: "Kunden-ID"
    ed:label@fr: "ID du client"
    ed:shared: true
    ed:classification: "Confidential"
    ed:examples:
    - "c1-10123123"
    ed:description@de: "Die interne ID eines B2C-Kunden im Online-Shop. Gastkunden haben ebenfalls eine Kunden-ID."
    ed:description@fr: "L'identifiant interne d'un client B2C dans la boutique en ligne. Les clients invités ont également un identifiant client."
  relationships:
  - name: "member_of"
    roles:
    - concept: "B2C"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{B2C/CustomerId} is a member of {B2C}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "TechnicalFields/ActualTimestamp"
  type: "ValueType"
  description: |-
    The timestamp at which the underlying source record was last updated.
    Reflects the business change time as reported by the source system, not when the record was observed or loaded into the data product.
  iri: "http://entropy-data.com/ontologies/global/TechnicalFields/ActualTimestamp"
  extends:
  - "DateTime"
  annotations:
    ed:label: "Last Updated Timestamp"
    ed:label@de: "Zeitstempel der letzten Aktualisierung"
    ed:label@fr: "Horodatage de la dernière mise à jour"
    ed:shared: true
    ed:classification: "Internal"
    ed:examples:
    - "2025-03-14T09:12:47Z"
    ed:description@de: |-
      Der Zeitstempel, zu dem der zugrunde liegende Quelldatensatz zuletzt aktualisiert wurde.
      Spiegelt die fachliche Änderungszeit des Quellsystems wider, nicht den Zeitpunkt der Beobachtung oder Beladung im Datenprodukt.
    ed:description@fr: |-
      L'horodatage auquel l'enregistrement source sous-jacent a été mis à jour pour la dernière fois.
      Reflète l'heure du changement métier telle que rapportée par le système source, et non le moment où l'enregistrement a été observé ou chargé dans le produit de données.
  relationships:
  - name: "member_of"
    roles:
    - concept: "TechnicalFields"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{TechnicalFields/ActualTimestamp} is a member of {TechnicalFields}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Sales/OrderId"
  type: "ValueType"
  description: "The user-facing ID that identifies an order in the online shop. Also used for support requests."
  iri: "http://entropy-data.com/ontologies/global/Sales/OrderId"
  extends:
  - "String"
  annotations:
    ed:label: "Order ID"
    ed:label@de: "Bestell-ID"
    ed:label@fr: "ID de commande"
    ed:shared: true
    ed:classification: "Confidential"
    ed:examples:
    - "100-0314678"
    ed:description@de: "Die dem Benutzer angezeigte ID, die eine Bestellung im Online-Shop identifiziert. Wird auch für Support-Anfragen verwendet."
    ed:description@fr: "L'identifiant visible par l'utilisateur qui identifie une commande dans la boutique en ligne. Également utilisé pour les demandes d'assistance."
  relationships:
  - name: "member_of"
    roles:
    - concept: "Sales"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Sales/OrderId} is a member of {Sales}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "TechnicalFields/ProcessedTimestamp"
  type: "ValueType"
  description: |-
    The timestamp at which the record was processed by the data pipeline.
    Useful for debugging ingestion lag and reproducing the state of the data product at a given point in time.
  iri: "http://entropy-data.com/ontologies/global/TechnicalFields/ProcessedTimestamp"
  extends:
  - "DateTime"
  annotations:
    ed:label: "Process Timestamp"
    ed:label@de: "Verarbeitungszeitstempel"
    ed:label@fr: "Horodatage de traitement"
    ed:shared: true
    ed:classification: "Internal"
    ed:examples:
    - "2025-03-14T09:15:02Z"
    ed:description@de: |-
      Der Zeitstempel, zu dem der Datensatz von der Datenpipeline verarbeitet wurde.
      Nützlich zum Debuggen von Ingestion-Verzögerungen und zur Reproduktion des Zustands des Datenprodukts zu einem bestimmten Zeitpunkt.
    ed:description@fr: |-
      L'horodatage auquel l'enregistrement a été traité par le pipeline de données.
      Utile pour déboguer le délai d'ingestion et reproduire l'état du produit de données à un moment donné.
  relationships:
  - name: "member_of"
    roles:
    - concept: "TechnicalFields"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{TechnicalFields/ProcessedTimestamp} is a member of {TechnicalFields}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Fulfillment/ShipmentId"
  type: "ValueType"
  description: |-
    A Shipment ID is an internal unique identifier for a shipment.
    It is typically associated with a shipment's tracking number.
  iri: "http://entropy-data.com/ontologies/global/Fulfillment/ShipmentId"
  extends:
  - "String"
  annotations:
    ed:label: "Shipment ID"
    ed:label@de: "Versand-ID"
    ed:label@fr: "ID d'expédition"
    ed:shared: true
    ed:classification: "Internal"
    ed:examples:
    - "123e4567-e89b-12d3-a456-426614174000"
    ed:description@de: |-
      Eine Versand-ID ist eine interne eindeutige Kennung für eine Sendung.
      Sie ist typischerweise mit der Tracking-Nummer einer Sendung verknüpft.
    ed:description@fr: |-
      Un ID d'expédition est un identifiant interne unique pour une expédition.
      Il est généralement associé au numéro de suivi d'une expédition.
  relationships:
  - name: "member_of"
    roles:
    - concept: "Fulfillment"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Fulfillment/ShipmentId} is a member of {Fulfillment}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Catalog/Sku"
  type: "ValueType"
  description: |-
    A Stock Keeping Unit (SKU) is an internal unique identifier for an article.
    It is typically associated with an article's barcode, such as the EAN/GTIN.
  iri: "http://entropy-data.com/ontologies/global/Catalog/Sku"
  extends:
  - "String"
  annotations:
    ed:label: "Stock Keeping Unit"
    ed:label@de: "Lagerhaltungseinheit"
    ed:label@fr: "Unité de gestion de stock"
    ed:shared: true
    ed:classification: "Internal"
    ed:examples:
    - "AC1212ME1"
    ed:pattern: "^[A-Za-z0-9]{8,14}$"
    ed:description@de: |-
      Eine Stock Keeping Unit (SKU) ist eine interne eindeutige Kennung für einen Artikel.
      Sie ist typischerweise mit dem Barcode eines Artikels verbunden, wie z. B. EAN/GTIN.
    ed:description@fr: |-
      Une unité de gestion de stock (SKU) est un identifiant interne unique pour un article.
      Elle est généralement associée au code-barres d'un article, tel que l'EAN/GTIN.
  relationships:
  - name: "member_of"
    roles:
    - concept: "Catalog"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Catalog/Sku} is a member of {Catalog}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "B2B/VatId"
  type: "ValueType"
  description: "VAT identification number of a business, in EU VIES format. Required for reverse-charge invoices to B2B customers."
  iri: "http://entropy-data.com/ontologies/global/B2B/VatId"
  extends:
  - "String"
  annotations:
    ed:label: "VAT ID"
    ed:label@de: "Umsatzsteuer-ID"
    ed:label@fr: "Numéro de TVA"
    ed:shared: true
    ed:classification: "Restricted"
    ed:examples:
    - "DE123456789"
    ed:pattern: "^[A-Z]{2}[A-Z0-9]{2,12}$"
    ed:description@de: "Umsatzsteuer-Identifikationsnummer eines Unternehmens im EU-VIES-Format. Erforderlich für Rechnungen an B2B-Kunden im Reverse-Charge-Verfahren."
    ed:description@fr: "Numéro d'identification à la TVA d'une entreprise, au format VIES UE. Requis pour les factures en autoliquidation aux clients B2B."
  relationships:
  - name: "member_of"
    roles:
    - concept: "B2B"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{B2B/VatId} is a member of {B2B}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Catalog/Article"
  type: "EntityType"
  description: "A specific orderable variant of a product, identified by its SKU (e.g. a given size and colour combination)."
  iri: "http://entropy-data.com/ontologies/global/Catalog/Article"
  identify_by:
  - "stock_keeping_unit"
  annotations:
    ed:label: "Article"
    ed:label@de: "Artikel"
    ed:label@fr: "Article"
    ed:description@de: "Eine spezifische bestellbare Variante eines Produkts, identifiziert durch ihre SKU (z. B. eine bestimmte Größen- und Farbkombination)."
    ed:description@fr: "Une variante spécifique commandable d'un produit, identifiée par son SKU (p. ex. une combinaison donnée de taille et de couleur)."
  relationships:
  - name: "stock_keeping_unit"
    roles:
    - concept: "Catalog/Sku"
    multiplicity: "OneToOne"
    verbalizes:
    - "{Catalog/Article} has {Catalog/Sku}"
    annotations:
      ed:relationship_type: "hasProperty"
  - name: "gtin"
    roles:
    - concept: "Catalog/Article.Gtin"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Catalog/Article} has {Catalog/Article.Gtin}"
    annotations:
      ed:relationship_type: "hasProperty"
  - name: "size"
    roles:
    - concept: "Catalog/Article.Size"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Catalog/Article} has {Catalog/Article.Size}"
    annotations:
      ed:relationship_type: "hasProperty"
  - name: "color"
    roles:
    - concept: "Catalog/Article.Color"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Catalog/Article} has {Catalog/Article.Color}"
    annotations:
      ed:relationship_type: "hasProperty"
  - name: "list_price"
    roles:
    - concept: "Catalog/Article.ListPrice"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Catalog/Article} has {Catalog/Article.ListPrice}"
    annotations:
      ed:relationship_type: "hasProperty"
  - name: "variant_of"
    description: "An article is one orderable variant of a product."
    roles:
    - concept: "Catalog/Product"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Catalog/Article} is a variant of {Catalog/Product}"
    - "{Catalog/Product} is offered as {Catalog/Article}"
  - name: "member_of"
    roles:
    - concept: "Catalog"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Catalog/Article} is a member of {Catalog}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "B2B/Customer"
