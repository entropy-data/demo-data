  - name: "duns_number"
    roles:
    - concept: "B2B/Customer.DunsNumber"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{B2B/Customer} has {B2B/Customer.DunsNumber}"
    annotations:
      ed:relationship_type: "hasProperty"
  - name: "industry_code"
    roles:
    - concept: "B2B/Customer.IndustryCode"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{B2B/Customer} has {B2B/Customer.IndustryCode}"
    annotations:
      ed:relationship_type: "hasProperty"
  - name: "company_size"
    roles:
    - concept: "B2B/Customer.CompanySize"
