version: "0.2.0.dev0"
name: "global"
description: |-
  Core business semantics for the demo retail organization.
  Shared properties were migrated from the legacy /definitions catalogue.
custom_properties:
  display_name: "Global"
  owner: "governance-group"
ontology:
- concept: "Catalog"
  id: "catalog"
  type: "GroupType"
  description: "Products, orderable article variants, and brands offered for sale."
  iri: "http://www.entropy-data.com/ns/main/Catalog"
  custom_properties:
    name@de: "Katalog"
    name@fr: "Catalogue"
    description@de: "Produkte, bestellbare Artikelvarianten und Marken, die zum Verkauf angeboten werden."
    description@fr: "Produits, variantes d'articles commandables et marques proposés à la vente."
- concept: "Controlling"
  id: "controlling"
  type: "GroupType"
  description: "Financial KPIs and commercial performance metrics."
  iri: "http://www.entropy-data.com/ns/main/Controlling"
  custom_properties:
    name@de: "Controlling"
    name@fr: "Contrôle de gestion"
    description@de: "Finanzkennzahlen und kommerzielle Leistungsindikatoren."
    description@fr: "Indicateurs financiers et mesures de performance commerciale."
- concept: "Customers"
  id: "customers"
  type: "GroupType"
  description: "People and households the business serves."
  iri: "http://www.entropy-data.com/ns/main/Customers"
  custom_properties:
    name@de: "Kunden"
    name@fr: "Clients"
    description@de: "Personen und Haushalte, die das Unternehmen bedient."
    description@fr: "Personnes et foyers servis par l'entreprise."
- concept: "Fulfillment"
  id: "fulfillment"
  type: "GroupType"
  description: "Inventory, picking, packing, and shipment of orders."
  iri: "http://www.entropy-data.com/ns/main/Fulfillment"
  custom_properties:
    name@de: "Auftragsabwicklung"
    name@fr: "Exécution"
    description@de: "Bestandsverwaltung, Kommissionierung, Verpackung und Versand der Bestellungen."
    description@fr: "Gestion des stocks, préparation, emballage et expédition des commandes."
- concept: "Sales"
  id: "sales"
  type: "GroupType"
  description: "Order taking, checkout, and post-sale customer service."
  iri: "http://www.entropy-data.com/ns/main/Sales"
  custom_properties:
    name@de: "Vertrieb"
    name@fr: "Ventes"
    description@de: "Bestellannahme, Checkout und Kundenservice nach dem Verkauf."
    description@fr: "Prise de commande, paiement et service après-vente."
- concept: "Technical Fields"
  id: "technical_fields"
  type: "GroupType"
  description: "Data pipeline metadata fields common to many tables, such as ingestion and processing timestamps."
  iri: "http://www.entropy-data.com/ns/main/TechnicalFields"
  custom_properties:
    name@de: "Technische Felder"
    name@fr: "Champs techniques"
    description@de: "Metadatenfelder der Datenpipeline, die in vielen Tabellen vorkommen, wie z. B. Zeitstempel für Ingestion und Verarbeitung."
    description@fr: "Champs de métadonnées du pipeline de données communs à de nombreuses tables, tels que les horodatages d'ingestion et de traitement."
- concept: "Customer Email"
  id: "customer_email"
  type: "ValueType"
  shared: true
  description: "The email address of a customer."
  iri: "http://www.entropy-data.com/ns/main/customerEmail"
  group: "customers"
  extends:
  - "String"
  classification: "Restricted"
  examples:
  - "mail@example.com"
  pattern: "^.*@.*$"
  custom_properties:
    name@de: "Kunden-E-Mail"
    name@fr: "E-mail du client"
    description@de: "Die E-Mail-Adresse eines Kunden."
    description@fr: "L'adresse e-mail d'un client."
- concept: "Customer ID"
  id: "customer_id"
  type: "ValueType"
  shared: true
  description: "The internal ID of any customer in the online shop. Guest customers have a customer ID as well."
  iri: "http://www.entropy-data.com/ns/main/customerId"
  group: "customers"
  extends:
  - "String"
  classification: "Confidential"
  examples:
  - "c1-10123123"
  custom_properties:
    name@de: "Kunden-ID"
    name@fr: "ID du client"
    description@de: "Die interne ID jedes Kunden im Online-Shop. Gastkunden haben ebenfalls eine Kunden-ID."
    description@fr: "L'identifiant interne de tout client dans la boutique en ligne. Les clients invités ont également un identifiant client."
- concept: "Last Updated Timestamp"
  id: "actual_timestamp"
  type: "ValueType"
  shared: true
  description: |-
    The timestamp at which the underlying source record was last updated.
    Reflects the business change time as reported by the source system, not when the record was observed or loaded into the data product.
  iri: "http://www.entropy-data.com/ns/main/actualTimestamp"
  group: "technical_fields"
  extends:
  - "DateTime"
  classification: "Internal"
  examples:
  - "2025-03-14T09:12:47Z"
  custom_properties:
    name@de: "Zeitstempel der letzten Aktualisierung"
    name@fr: "Horodatage de la dernière mise à jour"
    description@de: |-
      Der Zeitstempel, zu dem der zugrunde liegende Quelldatensatz zuletzt aktualisiert wurde.
      Spiegelt die fachliche Änderungszeit des Quellsystems wider, nicht den Zeitpunkt der Beobachtung oder Beladung im Datenprodukt.
    description@fr: |-
      L'horodatage auquel l'enregistrement source sous-jacent a été mis à jour pour la dernière fois.
      Reflète l'heure du changement métier telle que rapportée par le système source, et non le moment où l'enregistrement a été observé ou chargé dans le produit de données.
- concept: "Order ID"
  id: "order_id"
  type: "ValueType"
  shared: true
  description: "The user-facing ID that identifies an order in the online shop. Also used for support requests."
  iri: "http://www.entropy-data.com/ns/main/orderId"
  group: "sales"
  extends:
  - "String"
  classification: "Confidential"
  examples:
  - "100-0314678"
  custom_properties:
    name@de: "Bestell-ID"
    name@fr: "ID de commande"
    description@de: "Die dem Benutzer angezeigte ID, die eine Bestellung im Online-Shop identifiziert. Wird auch für Support-Anfragen verwendet."
    description@fr: "L'identifiant visible par l'utilisateur qui identifie une commande dans la boutique en ligne. Également utilisé pour les demandes d'assistance."
- concept: "Process Timestamp"
  id: "processed_timestamp"
  type: "ValueType"
  shared: true
  description: |-
    The timestamp at which the record was processed by the data pipeline.
    Useful for debugging ingestion lag and reproducing the state of the data product at a given point in time.
  iri: "http://www.entropy-data.com/ns/main/processedTimestamp"
  group: "technical_fields"
  extends:
  - "DateTime"
  classification: "Internal"
  examples:
  - "2025-03-14T09:15:02Z"
  custom_properties:
    name@de: "Verarbeitungszeitstempel"
    name@fr: "Horodatage de traitement"
    description@de: |-
      Der Zeitstempel, zu dem der Datensatz von der Datenpipeline verarbeitet wurde.
      Nützlich zum Debuggen von Ingestion-Verzögerungen und zur Reproduktion des Zustands des Datenprodukts zu einem bestimmten Zeitpunkt.
    description@fr: |-
      L'horodatage auquel l'enregistrement a été traité par le pipeline de données.
      Utile pour déboguer le délai d'ingestion et reproduire l'état du produit de données à un moment donné.
- concept: "Shipment ID"
  id: "shipment_id"
  type: "ValueType"
  shared: true
  description: |-
    A Shipment ID is an internal unique identifier for a shipment.
    It is typically associated with a shipment's tracking number.
  iri: "http://www.entropy-data.com/ns/main/shipmentId"
  group: "fulfillment"
  extends:
  - "String"
  classification: "Internal"
  examples:
  - "123e4567-e89b-12d3-a456-426614174000"
  custom_properties:
    name@de: "Versand-ID"
    name@fr: "ID d'expédition"
    description@de: |-
      Eine Versand-ID ist eine interne eindeutige Kennung für eine Sendung.
      Sie ist typischerweise mit der Tracking-Nummer einer Sendung verknüpft.
    description@fr: |-
      Un ID d'expédition est un identifiant interne unique pour une expédition.
      Il est généralement associé au numéro de suivi d'une expédition.
- concept: "Stock Keeping Unit"
  id: "sku"
  type: "ValueType"
  shared: true
  description: |-
    A Stock Keeping Unit (SKU) is an internal unique identifier for an article.
    It is typically associated with an article's barcode, such as the EAN/GTIN.
  iri: "http://www.entropy-data.com/ns/main/sku"
  group: "catalog"
  extends:
  - "String"
  classification: "Internal"
  examples:
  - "AC1212ME1"
  pattern: "^[A-Za-z0-9]{8,14}$"
  custom_properties:
    name@de: "Lagerhaltungseinheit"
    name@fr: "Unité de gestion de stock"
    description@de: |-
      Eine Stock Keeping Unit (SKU) ist eine interne eindeutige Kennung für einen Artikel.
      Sie ist typischerweise mit dem Barcode eines Artikels verbunden, wie z. B. EAN/GTIN.
    description@fr: |-
      Une unité de gestion de stock (SKU) est un identifiant interne unique pour un article.
      Elle est généralement associée au code-barres d'un article, tel que l'EAN/GTIN.
- concept: "Article"
  id: "article"
  type: "EntityType"
  description: "A specific orderable variant of a product, identified by its SKU (e.g. a given size and colour combination)."
  iri: "http://www.entropy-data.com/ns/main/Article"
  group: "catalog"
  custom_properties:
    name@de: "Artikel"
    name@fr: "Article"
    description@de: "Eine spezifische bestellbare Variante eines Produkts, identifiziert durch ihre SKU (z. B. eine bestimmte Größen- und Farbkombination)."
    description@fr: "Une variante spécifique commandable d'un produit, identifiée par son SKU (p. ex. une combinaison donnée de taille et de couleur)."
  relationships:
  - id: "article.color"
    name: "color"
    roles:
    - concept: "color"
    verbalizes:
    - "{Article} has {color}"
    type: "hasProperty"
  - id: "article.gtin"
    name: "gtin"
    roles:
    - concept: "gtin"
    verbalizes:
    - "{Article} has {gtin}"
    type: "hasProperty"
  - id: "article.list_price"
    name: "list_price"
    roles:
    - concept: "list_price"
    verbalizes:
    - "{Article} has {list_price}"
    type: "hasProperty"
  - id: "article.size"
    name: "size"
    roles:
    - concept: "size"
    verbalizes:
    - "{Article} has {size}"
    type: "hasProperty"
  - id: "article.stock_keeping_unit"
    name: "stock_keeping_unit"
    roles:
    - concept: "Stock Keeping Unit"
    verbalizes:
    - "{Article} has {Stock Keeping Unit}"
    type: "hasProperty"
- concept: "Billing Address"
  id: "billing_address"
  type: "EntityType"
  description: "A postal address used on the invoice for an order. Sub-type of Postal Address."
  iri: "http://www.entropy-data.com/ns/main/BillingAddress"
  group: "customers"
  extends:
  - "Postal Address"
  custom_properties:
    name@de: "Rechnungsadresse"
    name@fr: "Adresse de facturation"
    description@de: "Eine Postanschrift, die auf der Rechnung für eine Bestellung verwendet wird. Untertyp von Postal Address."
    description@fr: "Une adresse postale utilisée sur la facture d'une commande. Sous-type de Postal Address."
  relationships:
  - id: "billing_address.company_name"
    name: "company_name"
    roles:
    - concept: "company_name"
    verbalizes:
    - "{Billing Address} has {company_name}"
    type: "hasProperty"
  - id: "billing_address.vat_id"
    name: "vat_id"
    roles:
    - concept: "vat_id"
    verbalizes:
    - "{Billing Address} has {vat_id}"
    type: "hasProperty"
