- concept: "Sales/AverageOrderValue"
  type: "ValueType"
  description: |-
    The typical amount a customer spends per order. A core commerce KPI used to
    gauge pricing, bundling, and cross-sell effectiveness.
  iri: "http://entropy-data.com/ontologies/global/Sales/AverageOrderValue"
  annotations:
    ed:label: "Average Order Value"
    ed:label@de: "Durchschnittlicher Bestellwert"
    ed:label@fr: "Valeur moyenne de commande"
    ed:unit: "EUR"
    ed:better_when: "higher"
    ed:formula: "SUM(order.total_amount) / COUNT(DISTINCT order.id)"
    ed:value_type: "MetricType"
    ed:description@de: "Der typische Betrag, den ein Kunde pro Bestellung ausgibt. Eine zentrale Kennzahl für Preisgestaltung, Bundling und Cross-Selling."
    ed:description@fr: "Le montant typique qu'un client dépense par commande. Un indicateur clé pour la tarification, le bundling et la vente croisée."
  relationships:
  - name: "derived_from"
    description: "Average Order Value is derived from Gross Merchandise Value (divided by order count)."
    roles:
    - concept: "Controlling/Gmv"
    verbalizes:
    - "{Sales/AverageOrderValue} derived from {Controlling/Gmv}"
    annotations:
      ed:relationship_type: "derived_from"
  - name: "measures"
    description: "Average Order Value is measured on the Order entity."
    roles:
    - concept: "Sales/Order"
    verbalizes:
    - "{Sales/AverageOrderValue} measures {Sales/Order}"
    annotations:
      ed:relationship_type: "measures"
  - name: "member_of"
    roles:
    - concept: "Sales"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Sales/AverageOrderValue} is a member of {Sales}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Controlling/ContributionMargin1"
  type: "ValueType"
  description: |-
    GMV minus Cost of Goods Sold (COGS). The first step in the contribution-margin
    ladder. Shows what is left after paying for the products themselves.
  iri: "http://entropy-data.com/ontologies/global/Controlling/ContributionMargin1"
  annotations:
    ed:label: "Contribution Margin 1"
    ed:label@de: "Deckungsbeitrag 1"
    ed:label@fr: "Marge de contribution 1"
    ed:synonyms:
    - "CM1"
    ed:unit: "EUR"
    ed:better_when: "higher"
    ed:formula: "GMV - COGS"
    ed:value_type: "MetricType"
    ed:description@de: "Bruttowarenwert abzüglich Wareneinsatz (COGS). Die erste Stufe der Deckungsbeitragsrechnung. Zeigt, was nach den Warenkosten übrig bleibt."
    ed:description@fr: "Valeur brute des marchandises moins le coût des marchandises vendues (COGS). Première étape de la marge de contribution. Ce qui reste après les coûts produits."
  relationships:
  - name: "derived_from"
    description: "Contribution Margin 1 is GMV minus Cost of Goods Sold."
    roles:
    - concept: "Controlling/Gmv"
    verbalizes:
    - "{Controlling/ContributionMargin1} derived from {Controlling/Gmv}"
    annotations:
      ed:relationship_type: "derived_from"
  - name: "measures"
    description: "Contribution Margin 1 is measured per order."
    roles:
    - concept: "Sales/Order"
    verbalizes:
    - "{Controlling/ContributionMargin1} measures {Sales/Order}"
    annotations:
      ed:relationship_type: "measures"
  - name: "member_of"
    roles:
    - concept: "Controlling"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Controlling/ContributionMargin1} is a member of {Controlling}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Controlling/ContributionMargin2"
  type: "ValueType"
  description: |-
    CM1 minus variable fulfillment, payment, and marketing costs. Shows the margin
    left after all directly attributable variable costs of the sale.
  iri: "http://entropy-data.com/ontologies/global/Controlling/ContributionMargin2"
  annotations:
    ed:label: "Contribution Margin 2"
    ed:label@de: "Deckungsbeitrag 2"
    ed:label@fr: "Marge de contribution 2"
    ed:synonyms:
    - "CM2"
    ed:unit: "EUR"
    ed:better_when: "higher"
    ed:formula: "CM1 - variable_fulfillment_costs - payment_costs - marketing_costs"
    ed:value_type: "MetricType"
    ed:description@de: "DB1 abzüglich variabler Fulfillment-, Zahlungs- und Marketingkosten. Zeigt die Marge nach allen direkt zurechenbaren variablen Kosten des Verkaufs."
    ed:description@fr: "MC1 moins les coûts variables de logistique, de paiement et de marketing. Indique la marge après l'ensemble des coûts variables directement imputables à la vente."
  relationships:
  - name: "derived_from"
    description: "Contribution Margin 2 is CM1 minus variable fulfillment, payment, and marketing costs."
    roles:
    - concept: "Controlling/ContributionMargin1"
    verbalizes:
    - "{Controlling/ContributionMargin2} derived from {Controlling/ContributionMargin1}"
    annotations:
      ed:relationship_type: "derived_from"
  - name: "measures"
    description: "Contribution Margin 2 is measured per order."
    roles:
    - concept: "Sales/Order"
    verbalizes:
    - "{Controlling/ContributionMargin2} measures {Sales/Order}"
    annotations:
      ed:relationship_type: "measures"
  - name: "member_of"
    roles:
    - concept: "Controlling"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Controlling/ContributionMargin2} is a member of {Controlling}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Controlling/ContributionMargin3"
  type: "ValueType"
  description: |-
    CM2 minus the impact of returns (refunded revenue and return-handling costs).
    The most realistic view of per-order profitability for ecommerce businesses.
  iri: "http://entropy-data.com/ontologies/global/Controlling/ContributionMargin3"
  annotations:
    ed:label: "Contribution Margin 3"
    ed:label@de: "Deckungsbeitrag 3"
    ed:label@fr: "Marge de contribution 3"
    ed:synonyms:
    - "CM3"
    ed:unit: "EUR"
    ed:better_when: "higher"
    ed:formula: "CM2 - refunded_revenue - return_handling_costs"
    ed:value_type: "MetricType"
    ed:description@de: "DB2 abzüglich der Auswirkungen von Retouren (erstattete Umsätze und Retourenabwicklungskosten). Die realistischste Sicht auf die Profitabilität je Bestellung im E-Commerce."
    ed:description@fr: "MC2 moins l'impact des retours (chiffre d'affaires remboursé et coûts de traitement des retours). La vision la plus réaliste de la rentabilité par commande en e-commerce."
  relationships:
  - name: "derived_from"
    description: "Contribution Margin 3 is CM2 minus the impact of returns."
    roles:
    - concept: "Controlling/ContributionMargin2"
    verbalizes:
    - "{Controlling/ContributionMargin3} derived from {Controlling/ContributionMargin2}"
    annotations:
      ed:relationship_type: "derived_from"
  - name: "measures"
    description: "Contribution Margin 3 is measured per order."
    roles:
    - concept: "Sales/Order"
    verbalizes:
    - "{Controlling/ContributionMargin3} measures {Sales/Order}"
    annotations:
      ed:relationship_type: "measures"
  - name: "member_of"
    roles:
    - concept: "Controlling"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Controlling/ContributionMargin3} is a member of {Controlling}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Sales/ConversionRate"
  type: "ValueType"
  description: |-
    Share of website sessions that result in a completed order. The headline
    funnel KPI for ecommerce. Higher is better.
  iri: "http://entropy-data.com/ontologies/global/Sales/ConversionRate"
  annotations:
    ed:label: "Conversion Rate"
    ed:label@de: "Konversionsrate"
    ed:label@fr: "Taux de conversion"
    ed:unit: "%"
    ed:better_when: "higher"
    ed:formula: "COUNT(order) / COUNT(session) * 100"
    ed:value_type: "MetricType"
    ed:description@de: "Anteil der Website-Sitzungen, die zu einer abgeschlossenen Bestellung führen. Die zentrale Funnel-Kennzahl im E-Commerce. Je höher, desto besser."
    ed:description@fr: "Part des sessions du site qui aboutissent à une commande finalisée. L'indicateur clé du tunnel de conversion e-commerce. Plus c'est haut, mieux c'est."
  relationships:
  - name: "measures"
    description: "Conversion Rate is measured against placed orders as the desired outcome."
    roles:
    - concept: "Sales/Order"
    verbalizes:
    - "{Sales/ConversionRate} measures {Sales/Order}"
    annotations:
      ed:relationship_type: "measures"
  - name: "member_of"
    roles:
    - concept: "Sales"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Sales/ConversionRate} is a member of {Sales}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Controlling/Gmv"
  type: "ValueType"
  description: |-
    Total value of all placed orders before refunds, returns, and discounts.
    The headline ecommerce KPI, commonly abbreviated as GMV.
  iri: "http://entropy-data.com/ontologies/global/Controlling/Gmv"
  annotations:
    ed:label: "Gross Merchandise Value"
    ed:label@de: "Bruttowarenwert"
    ed:label@fr: "Valeur brute des marchandises"
    ed:synonyms:
    - "GMV"
    ed:unit: "EUR"
    ed:better_when: "higher"
    ed:formula: "SUM(order.total_amount)"
    ed:value_type: "MetricType"
    ed:description@de: "Gesamtwert aller aufgegebenen Bestellungen vor Rückerstattungen, Retouren und Rabatten. Die zentrale E-Commerce-Kennzahl, oft als GMV abgekürzt."
    ed:description@fr: "Valeur totale de toutes les commandes passées avant remboursements, retours et remises. L'indicateur clé de l'e-commerce, souvent abrégé GMV."
  relationships:
  - name: "measures"
    description: "Gross Merchandise Value is the aggregation of the order's total amount."
    roles:
    - concept: "Sales/Order.TotalAmount"
    verbalizes:
    - "{Controlling/Gmv} measures {Sales/Order.TotalAmount}"
    annotations:
      ed:relationship_type: "measures"
  - name: "member_of"
    roles:
    - concept: "Controlling"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Controlling/Gmv} is a member of {Controlling}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Fulfillment/NoFindRate"
  type: "ValueType"
  description: |-
    Share of warehouse pick tasks where the picker could not locate the item at
    its expected storage location (out of stock, misplaced, damaged). A core
    warehouse-quality KPI. Lower is better.
  iri: "http://entropy-data.com/ontologies/global/Fulfillment/NoFindRate"
  annotations:
    ed:label: "No-Find Rate"
    ed:label@de: "Nichtauffindungsquote"
    ed:label@fr: "Taux d'introuvables"
    ed:unit: "%"
    ed:better_when: "lower"
    ed:formula: "COUNT(pick_task WHERE status = 'not_found') / COUNT(pick_task) * 100"
    ed:value_type: "MetricType"
    ed:description@de: "Anteil der Kommissionier-Vorgänge im Lager, bei denen der Artikel am erwarteten Lagerplatz nicht gefunden werden konnte (vergriffen, falsch eingelagert, beschädigt). Eine zentrale Kennzahl für die Lagerqualität. Je niedriger, desto besser."
    ed:description@fr: "Part des opérations de picking en entrepôt où l'article n'a pas pu être trouvé à son emplacement prévu (rupture, mal rangé, endommagé). Un indicateur clé de la qualité d'entrepôt. Plus c'est bas, mieux c'est."
  relationships:
  - name: "measures"
    description: "No-Find Rate is measured per warehouse pick task (one per line item)."
    roles:
    - concept: "Sales/LineItem"
    verbalizes:
    - "{Fulfillment/NoFindRate} measures {Sales/LineItem}"
    annotations:
      ed:relationship_type: "measures"
  - name: "member_of"
    roles:
    - concept: "Fulfillment"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Fulfillment/NoFindRate} is a member of {Fulfillment}"
    annotations:
      ed:relationship_type: "memberOf"
- concept: "Fulfillment/OrderFulfillmentTime"
  type: "ValueType"
  description: |-
    Average time between an order being placed and the first shipment leaving the
    warehouse. A core fulfillment KPI. Lower is better.
  iri: "http://entropy-data.com/ontologies/global/Fulfillment/OrderFulfillmentTime"
  annotations:
    ed:label: "Order Fulfillment Time"
    ed:label@de: "Auftragsabwicklungszeit"
    ed:label@fr: "Délai d'exécution des commandes"
    ed:unit: "hours"
    ed:better_when: "lower"
    ed:formula: "AVG(shipment.dispatched_at - order.placed_at)"
    ed:value_type: "MetricType"
    ed:description@de: "Durchschnittliche Zeit zwischen Bestelleingang und Versand aus dem Lager. Eine zentrale Kennzahl für die Auftragsabwicklung. Je niedriger, desto besser."
    ed:description@fr: "Temps moyen entre la passation d'une commande et l'expédition depuis l'entrepôt. Un indicateur clé de l'exécution. Plus c'est bas, mieux c'est."
  relationships:
  - name: "measures"
    description: "Order Fulfillment Time is measured on the Shipment entity."
    roles:
    - concept: "Fulfillment/Shipment"
    verbalizes:
    - "{Fulfillment/OrderFulfillmentTime} measures {Fulfillment/Shipment}"
    annotations:
      ed:relationship_type: "measures"
  - name: "member_of"
    roles:
    - concept: "Fulfillment"
    multiplicity: "ManyToOne"
    verbalizes:
    - "{Fulfillment/OrderFulfillmentTime} is a member of {Fulfillment}"
    annotations:
      ed:relationship_type: "memberOf"
