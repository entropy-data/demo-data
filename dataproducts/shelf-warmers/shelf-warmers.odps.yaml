apiVersion: "v1.1.0"
kind: "DataProduct"
id: "shelf-warmers"
name: "Shelf Warmers"
status: "draft"
type: "aggregate"
domain: "operations"
# edited on the git side during the smoke test
description:
  purpose: "A list of articles with no sales in last 6 months"
context:
  instructions: "Shelf warmers are articles in stock that have not been sold in the last 6 months. The data is refreshed daily. The table is DP_SHELF_WARMERS.OP_SHELF_WARMERS_V1.SHELF_WARMERS with columns SKU, ARTICLE_NAME, LAST_SALE_TIMESTAMP, PROCESSING_TIMESTAMP. LAST_SALE_TIMESTAMP is NULL for articles that have never had a recorded sale."
  verifiedStatements:
  - question: "How many shelf warmers do we currently have?"
    answer: "SELECT COUNT(*) AS shelf_warmer_count FROM DP_SHELF_WARMERS.OP_SHELF_WARMERS_V1.SHELF_WARMERS;"
  - question: "Which shelf warmers have never been sold?"
    answer: "SELECT SKU, ARTICLE_NAME FROM DP_SHELF_WARMERS.OP_SHELF_WARMERS_V1.SHELF_WARMERS WHERE LAST_SALE_TIMESTAMP IS NULL;"
  - question: "What are the shelf warmers with the most recent past sale?"
    answer: "SELECT SKU, ARTICLE_NAME, LAST_SALE_TIMESTAMP FROM DP_SHELF_WARMERS.OP_SHELF_WARMERS_V1.SHELF_WARMERS WHERE LAST_SALE_TIMESTAMP IS NOT NULL ORDER BY LAST_SALE_TIMESTAMP DESC LIMIT 20;"
synonyms:
